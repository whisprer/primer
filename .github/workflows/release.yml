name: Package GitHub release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Verify and attach canonical crate
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy --component rustfmt

      - name: Verify tag matches Cargo version
        shell: bash
        run: |
          set -euo pipefail
          package_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test -n "$package_version"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Validate source
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --all-targets --locked -- -D warnings
          cargo +stable test --all-targets --locked

      - name: Verify exact package contents
        run: |
          cargo +stable package --list --locked > "$RUNNER_TEMP/package-files.txt"
          diff -u .github/package-files.txt "$RUNNER_TEMP/package-files.txt"

      - name: Build crate and checksum
        shell: bash
        run: |
          set -euo pipefail
          cargo +stable package --locked
          package_version="${GITHUB_REF_NAME#v}"
          crate_name="primer-sieve-${package_version}.crate"
          test -f "target/package/$crate_name"
          (cd target/package && sha256sum "$crate_name" > "$crate_name.sha256")

      - name: Create GitHub release
        shell: bash
        run: |
          set -euo pipefail
          package_version="${GITHUB_REF_NAME#v}"
          crate_name="primer-sieve-${package_version}.crate"
          gh release create "$GITHUB_REF_NAME" \
            "target/package/$crate_name" \
            "target/package/$crate_name.sha256" \
            --verify-tag \
            --generate-notes \
            --title "Primer $GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ github.token }}
