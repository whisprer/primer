name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Stable / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal

      - name: Run all tests
        run: cargo +stable test --all-targets --locked

  msrv:
    name: MSRV / Rust 1.70.0
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust 1.70.0
        run: rustup toolchain install 1.70.0 --profile minimal

      - name: Run all tests
        run: cargo +1.70.0 test --all-targets --locked

  quality:
    name: Format, lint, docs, and package
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: >-
          rustup toolchain install stable --profile minimal
          --component clippy --component rustfmt

      - name: Check formatting
        run: cargo +stable fmt --all -- --check

      - name: Run Clippy
        run: cargo +stable clippy --all-targets --locked -- -D warnings

      - name: Build documentation with warnings denied
        run: cargo +stable doc --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Verify exact package contents
        run: |
          cargo +stable package --list --locked > "$RUNNER_TEMP/package-files.txt"
          diff -u .github/package-files.txt "$RUNNER_TEMP/package-files.txt"

      - name: Build and verify package archive
        run: cargo +stable package --locked
